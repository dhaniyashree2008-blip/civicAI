<!DOCTYPE html>

<html>

<head>

    <title>CivicAI</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #172033;
        }

        .header {
            background: #123b6d;
            color: white;
            padding: 22px 8%;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .subtitle {
            margin-top: 5px;
            opacity: 0.85;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d0d5dd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #123b6d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d2e55;
        }

        .language-info {
            margin-top: 8px;
            color: #667085;
            font-size: 13px;
        }

        .dashboard {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #123b6d;
            text-decoration: none;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="header">

        <div class="logo">
            🌍 CivicAI
        </div>

        <div class="subtitle">
            AI-Powered Citizen Development Intelligence Platform
        </div>

    </div>


    <div class="container">

        <div class="card">

            <h1>
                Submit a Development Request
            </h1>

            <p>
                Report an infrastructure or
                public-service issue in your area.
            </p>


            <form
                action="/submit"
                method="POST"
            >


                <label>
                    Preferred Language
                </label>

                <select
                    name="language"
                >

                    <option value="English">
                        English
                    </option>

                    <option value="Tamil">
                        தமிழ் (Tamil)
                    </option>

                    <option value="Hindi">
                        हिन्दी (Hindi)
                    </option>

                    <option value="Telugu">
                        తెలుగు (Telugu)
                    </option>

                </select>

                <div class="language-info">
                    CivicAI supports multilingual citizen
                    submissions in the prototype.
                </div>


                <label>
                    Location
                </label>

                <input
                    type="text"
                    name="location"
                    placeholder="Example: Village A"
                    required
                >


                <label>
                    Development Category
                </label>

                <select
                    name="category"
                    required
                >

                    <option value="Road Infrastructure">
                        Road Infrastructure
                    </option>

                    <option value="Water Supply">
                        Water Supply
                    </option>

                    <option value="Electricity">
                        Electricity
                    </option>

                    <option value="Healthcare">
                        Healthcare
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label>
                    Describe the Problem
                </label>

                <textarea
                    name="description"
                    placeholder="Describe the development issue..."
                    required
                ></textarea>


                <button type="submit">

                    🤖 Analyze Request

                </button>

            </form>


            <a
                class="dashboard"
                href="/dashboard"
            >
                🏛️ Open Government Dashboard
            </a>

        </div>

    </div>

</body>

</html>
